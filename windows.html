<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1117">
  <link rel="manifest" href="manifest.json">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>support.sheet – Windows Admin Cheatsheet</title>

  <link rel="stylesheet" href="fonts/fonts.css">

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/toast.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/recent.css">
  <link rel="stylesheet" href="css/favorites.css">
  <link rel="stylesheet" href="css/search.css">
</head>
<body>

  <!-- ── HEADER ──────────────────────────────────────────── -->
  <header>
    <!-- Logo -->
    <a href="index.html" class="logo">
      <div class="logo-icon" id="as-logo-icon">⚡</div>
      <div class="logo-text" id="as-logo-label">support<span>.sheet</span></div>
    </a>

    <!-- Zähler rechts -->
    <div class="header-right">
      <div class="pill pill-count" id="cmd-count">0 Befehle</div>
    </div>
  </header>


  <!-- ── TEMPLATE ────────────────────────────────────────── -->
  <template id="command-template">
    <div class="command-card">
      <div class="card-header">
        <h3 data-field="name"></h3>
        <button class="star-btn" data-action="star"
                aria-label="Zu Favoriten hinzufügen"
                aria-pressed="false">★</button>
      </div>
      <p data-field="desc"></p>
      <code data-field="cmd"></code>
      <div class="card-footer">
        <div data-field="tags"></div>
        <button class="copy-btn" data-action="copy">📋 Kopieren</button>
      </div>
    </div>
  </template>

  <!-- ── MAIN ────────────────────────────────────────────── -->
  <main>

    <section id="favorites-section" hidden>
      <h2 class="section-title">⭐ Meine Favoriten</h2>
      <div id="favorites-container"></div>
    </section>

    <section id="recent-section" hidden>
      <h2 class="section-title">🕐 Zuletzt verwendet</h2>
      <div id="recent-container"></div>
    </section>

    <div id="search-filter-bar">
      <div class="search-wrap-inline">
        <span class="search-icon">🔍</span>
        <input type="text"
               id="search-input"
               class="search-input-inline"
               placeholder="Befehl suchen... (Ctrl+K)"
               autocomplete="off"
               spellcheck="false">
        <button class="search-clear" id="search-clear"
                aria-label="Suche leeren" hidden>✕</button>
      </div>
      <div class="safe-mode-bar" id="safe-mode-bar">
        <label class="safe-mode-toggle" id="safe-mode-label">
          <div class="safe-mode-switch" id="safe-mode-switch">
            <input type="checkbox" id="safe-mode-checkbox"
                   aria-label="Safe Mode">
            <div class="safe-mode-track">
              <div class="safe-mode-thumb"></div>
            </div>
          </div>
          <span class="safe-mode-text">Safe Mode</span>
          <span class="safe-mode-desc" id="safe-mode-desc">
            aus
          </span>
        </label>
        <span class="safe-mode-hint" id="safe-mode-hint"
              hidden>
          🛡️ HIGH-Risk Commands ausgeblendet
        </span>
      </div>
      <div id="filter-bar"></div>
    </div>
    <div id="commands-container"></div>

  </main>


  <!-- ── SCRIPTS ─────────────────────────────────────────── -->
  <script src="js/fuse.min.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/marked.min.js"></script>
  <script src="js/guide-overlay.js"></script>
  <script src="js/settings-store.js"></script>
  <script src="js/variables.js"></script>
  <script src="js/recent.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/search.js"></script>
  <script src="js/render.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
    function updateCommandCount(n) {
      const stat  = document.getElementById('stat-total');
      const count = document.getElementById('cmd-count');
      if (stat)  stat.textContent  = n;
      if (count) count.textContent = n + ' Befehle';
    }
  </script>

  <script src="nav.js"></script>

  <!-- Guide Overlay -->
  <div id="guide-overlay" class="guide-overlay" hidden aria-modal="true" role="dialog">
    <div class="guide-overlay-backdrop"></div>
    <div class="guide-overlay-panel">
      <div class="guide-overlay-header">
        <div class="guide-overlay-title" id="guide-overlay-title"></div>
        <div class="guide-overlay-actions">
          <a href="#" id="guide-overlay-open"
             class="guide-overlay-open-btn"
             target="_blank" rel="noopener">
            ↗ In guide.sheet oeffnen
          </a>
          <button class="guide-overlay-close" id="guide-overlay-close"
                  aria-label="Schliessen" title="Schliessen">✕</button>
        </div>
      </div>
      <div class="guide-overlay-content" id="guide-overlay-content">
        <!-- Markdown wird hier gerendert -->
      </div>
    </div>
  </div>

</body>
</html>
