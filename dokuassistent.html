<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1117">
  <link rel="manifest" href="manifest.json">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>support.sheet – Dokuassistent</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/toast.css">
  <style>
    /* Kacheln/Grid identisch zu den Command-Karten (windows.html & Co.):
       .cmd-grid/.command-card/.card-header/.card-footer, keine neue
       Layout-Variante. Nur die zwei Footer-Buttons sind neu (analog zu
       scripts.html's page-lokalem .script-guide-btn/.script-dl-btn),
       da Command-Karten kein "Vollansicht oeffnen" kennen. */
    .doku-view-btn, .doku-copy-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 6px 12px; border-radius: 7px; font-size: .76rem; font-weight: 600;
      cursor: pointer; transition: all .15s; border: 1px solid transparent;
    }
    .doku-view-btn {
      border-color: rgba(124,140,248,.35); background: rgba(124,140,248,.08); color: var(--accent);
    }
    .doku-view-btn:hover { background: rgba(124,140,248,.18); }
    .doku-copy-btn {
      border-color: rgba(74,222,128,.35); background: rgba(74,222,128,.08); color: #4ade80;
      margin-left: auto;
    }
    .doku-copy-btn:hover { background: rgba(74,222,128,.18); }

    /* Voller Prompt-Text im Overlay - .guide-overlay-content pre ist per
       Default nur horizontal scrollbar (fuer Code gedacht); hier soll der
       Fliesstext stattdessen sauber umbrechen, nichts wird abgeschnitten. */
    .doku-prompt-text { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <div class="logo-icon" id="as-logo-icon">📄</div>
      <div class="logo-text" id="as-logo-label">support<span>.doku</span></div>
    </a>
    <div class="header-right">
      <div class="pill pill-count"
           style="border-color:rgba(251,146,60,.3);background:rgba(251,146,60,.08);color:#fb923c;">
        📄 Dokuassistent
      </div>
    </div>
  </header>

  <!-- Tab-Bar wird von nav.js injiziert -->

  <main>
    <div class="hero">
      <div class="hero-badge">🧪 In Erprobung</div>
      <h1>Dokuassistent</h1>
      <p>Fünf fertige Prompts für die Doku- und Ticket-Nacharbeit nach einem Chat. Die Formulierungen werden aktuell noch getestet und können sich noch ändern.</p>
    </div>

    <div class="cmd-grid" id="doku-prompt-container"></div>
  </main>

  <!-- Prompt-Overlay - eigenstaendige Kopie des Verhaltens von
       js/script-overlay.js (Backdrop/Panel/Escape/Fokus/Scroll-Lock), selbe
       .guide-overlay-*-Klassen aus css/main.css, kein neues Grundgeruest. -->
  <div id="doku-prompt-overlay" class="guide-overlay" hidden aria-modal="true" role="dialog">
    <div class="guide-overlay-backdrop"></div>
    <div class="guide-overlay-panel">
      <div class="guide-overlay-header">
        <div class="guide-overlay-title" id="doku-prompt-overlay-title"></div>
        <div class="guide-overlay-actions">
          <button type="button" class="guide-overlay-open-btn copy-btn" id="doku-prompt-overlay-copy">📋 Kopieren</button>
          <button class="guide-overlay-close" id="doku-prompt-overlay-close"
                  aria-label="Schliessen" title="Schliessen">✕</button>
        </div>
      </div>
      <div class="guide-overlay-content">
        <pre class="doku-prompt-text" id="doku-prompt-overlay-text"></pre>
      </div>
    </div>
  </div>

  <script>
    // Prompt-Texte als einzige Quelle für Anzeige (Karte + Overlay) UND
    // Kopieren (kein Auslesen aus dem gerenderten DOM) - schliesst aus, dass
    // sich Anzeige- und Kopiertext durch spaetere DOM-Manipulation je
    // auseinander entwickeln.
    const DOKU_PROMPTS = [
      {
        icon: '📄',
        title: 'Doku erstellen (strukturiert)',
        desc: 'Ausführliche technische Dokumentation mit fester Gliederung.',
        text: `Erstelle mir aus unserem Chat eine technische Dokumentation. Nutze
ausschließlich das, was in diesem Chat tatsächlich besprochen/durchgeführt
wurde, erfinde nichts hinzu. Gliedere wie folgt:

1. Ausgangslage – worum ging es, was war das Problem/die Anforderung
2. Durchgeführte Schritte – chronologisch, inkl. konkret verwendeter
   Befehle/Einstellungen, soweit im Chat vorhanden
3. Ergebnis – aktueller Status, was funktioniert jetzt
4. Offene Punkte – falls etwas noch nicht abgeschlossen ist

Format: Markdown mit Überschriften, technische Sprache, für
IT-interne Weiterverwendung.`,
      },
      {
        icon: '📝',
        title: 'Doku erstellen (schnell)',
        desc: 'Kurze, formlose Zusammenfassung ohne feste Gliederung.',
        text: `Erstelle mir eine kurze Dokumentation zu dem, was wir in diesem Chat
gemacht haben. Nur auf Basis der tatsächlichen Inhalte dieses Chats,
nichts hinzuerfinden. Kurz und sachlich, keine ausführliche
Gliederung nötig.`,
      },
      {
        icon: '🎫',
        title: 'Doku für Ticket',
        desc: 'Interner, technischer Tickettext in fester 5-Punkte-Struktur.',
        text: `Erstelle mir einen kurzen, internen Tickettext auf Basis dieses Chats.
Technische Sprache, für IT-interne Dokumentation (nicht für den
Kunden). Kurz halten, in dieser Struktur:

1. Problembeschreibung
2. Analyse
3. Ursache
4. Lösung/Behebung/Fix
5. Tipp/Hinweis (nur falls sinnvoll, sonst weglassen)

Nur auf Basis dessen, was tatsächlich in diesem Chat besprochen wurde.`,
      },
      {
        icon: '💶',
        title: 'Rechnungstext',
        desc: 'Einfacher, stichwortartiger Text für die Rechnungsstellung.',
        text: `Erstelle mir einen Rechnungstext auf Basis dieses Chats. Stichwortartig,
kurz und einfach gehalten, keine tiefen technischen Details. Für die
Rechnungsstellung an den Kunden geeignet – verständlich auch ohne
IT-Fachwissen.`,
      },
      {
        icon: '💬',
        title: 'Antwort an Kunden',
        desc: 'Kurze, freundliche Kundenantwort zum Ticketabschluss.',
        text: `Erstelle mir eine kurze Kundenantwort zum Ticketabschluss, auf Basis
dieses Chats. Freundlich, verständlich, ohne technisches Fachvokabular.
Kurz halten – worum ging es, ist es gelöst, muss der Kunde noch etwas tun.`,
      },
    ];

    // ── Kopieren: identischer Mechanismus wie js/render.js (Command-Karten,
    // z.B. "Computerverwaltung" in windows.html) - navigator.clipboard mit
    // execCommand-Fallback fuer unsichere Kontexte, Bestaetigung ueber
    // showToast() (js/toast.js) + .copied/.copy-error-Klassen aus main.css.
    // Bewusst als lokale Kopie statt render.js einzubinden: render.js haengt
    // an windows.html-spezifischer Struktur (CATEGORY_MAP, Filter-Bar,
    // Favoriten, #commands-container), die hier komplett ungenutzt waere -
    // gleiches Vorgehen wie js/script-overlay.js, das den Kopieren-Button aus
    // js/guides-view.js aus demselben Grund lokal spiegelt statt einzubinden.
    function copyToClipboard(text, btn) {
      const onSuccess = () => {
        btn.classList.add('copied');
        setTimeout(() => btn.classList.remove('copied'), 1500);
        if (typeof showToast === 'function') showToast('Kopiert!', 'success');
      };
      const onError = err => {
        console.warn('Kopieren fehlgeschlagen', err);
        btn.classList.add('copy-error');
        setTimeout(() => btn.classList.remove('copy-error'), 1500);
        if (typeof showToast === 'function') showToast('Kopieren fehlgeschlagen', 'error');
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(onSuccess).catch(() => execCommandFallback(text, onSuccess, onError));
      } else {
        execCommandFallback(text, onSuccess, onError);
      }
    }

    function execCommandFallback(text, onSuccess, onError) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      try {
        document.execCommand('copy') ? onSuccess() : onError(new Error('execCommand returned false'));
      } catch (err) {
        onError(err);
      } finally {
        document.body.removeChild(ta);
      }
    }

    // ── Prompt-Overlay: eigene, schlanke Kopie von ScriptOverlay.open()/close() -
    // gleiche Interaktion (Backdrop-Klick, Escape, Fokus auf Schliessen-Button,
    // body-Scroll-Lock), aber ohne den Rest von script-overlay.js (Skript-
    // Download, SHA-256, data/script-guides.json), der hier nicht passt.
    let _activePrompt = null;

    function openPromptOverlay(prompt) {
      _activePrompt = prompt;
      document.getElementById('doku-prompt-overlay-title').textContent = prompt.title;
      document.getElementById('doku-prompt-overlay-text').textContent = prompt.text;
      const overlay = document.getElementById('doku-prompt-overlay');
      overlay.hidden = false;
      document.body.style.overflow = 'hidden';
      document.getElementById('doku-prompt-overlay-close').focus();
    }

    function closePromptOverlay() {
      document.getElementById('doku-prompt-overlay').hidden = true;
      document.body.style.overflow = '';
      _activePrompt = null;
    }

    function initPromptOverlay() {
      const overlay = document.getElementById('doku-prompt-overlay');
      const backdrop = overlay.querySelector('.guide-overlay-backdrop');
      document.getElementById('doku-prompt-overlay-close').addEventListener('click', closePromptOverlay);
      backdrop.addEventListener('click', closePromptOverlay);
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !overlay.hidden) closePromptOverlay();
      });
      document.getElementById('doku-prompt-overlay-copy').addEventListener('click', e => {
        if (_activePrompt) copyToClipboard(_activePrompt.text, e.currentTarget);
      });
    }

    // ── Karten im Command-Karten-Stil (.command-card/.card-header/.card-footer) ──
    function buildPromptCard(prompt) {
      const card = document.createElement('div');
      card.className = 'command-card';

      const header = document.createElement('div');
      header.className = 'card-header';
      const h3 = document.createElement('h3');
      h3.textContent = `${prompt.icon} ${prompt.title}`;
      header.appendChild(h3);
      card.appendChild(header);

      const desc = document.createElement('p');
      desc.textContent = prompt.desc;
      card.appendChild(desc);

      const footer = document.createElement('div');
      footer.className = 'card-footer';

      const viewBtn = document.createElement('button');
      viewBtn.type = 'button';
      viewBtn.className = 'doku-view-btn';
      viewBtn.textContent = '👁 Prompt anzeigen';
      viewBtn.addEventListener('click', () => openPromptOverlay(prompt));
      footer.appendChild(viewBtn);

      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'doku-copy-btn copy-btn';
      copyBtn.textContent = '📋 Kopieren';
      copyBtn.addEventListener('click', () => copyToClipboard(prompt.text, copyBtn));
      footer.appendChild(copyBtn);

      card.appendChild(footer);
      return card;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('doku-prompt-container');
      DOKU_PROMPTS.forEach(p => container.appendChild(buildPromptCard(p)));
      initPromptOverlay();
    });
  </script>

  <script src="js/toast.js"></script>
  <script src="nav.js"></script>

</body>
</html>
